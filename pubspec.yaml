name: shohojpath
description: "Shohojpath - dyslexia-friendly Bangla reading interface (HCD research prototype)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bangla text-to-speech (read aloud + word highlighting)
  flutter_tts: ^4.2.0
  # Reading settings / session state propagation
  provider: ^6.1.2
  # Local session + settings-change logging for the study
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  # CSV export of session data for research analysis
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  fonts:
    # Primary. Static instances pulled from Google Fonts (OFL).
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

    - family: SolaimanLipi
      fonts:
        - asset: assets/fonts/SolaimanLipi-Regular.ttf
          weight: 400
        - asset: assets/fonts/SolaimanLipi-Bold.ttf
          weight: 700

    # Kalpurush and AdorshoLipi ship a single weight only; Flutter will
    # synthesise bold, which is what a participant would see on any device.
    - family: Kalpurush
      fonts:
        - asset: assets/fonts/Kalpurush-Regular.ttf
          weight: 400

    - family: AdorshoLipi
      fonts:
        - asset: assets/fonts/AdorshoLipi-Regular.ttf
          weight: 400
